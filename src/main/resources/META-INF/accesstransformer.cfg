# 1.21.1 line. This file differs from main's by design: the two game versions put
# the same information behind different access levels.
#
# The 128-block spawn sphere lives on ChunkMap here and is package-private, so
# SpawnRule.PLAYER_IN_SPAWN_RANGE cannot read it without this line. On 26.1 the
# same check is reachable as ServerLevel.anyPlayerCloseEnoughForSpawning and needs
# no transformer at all.
public net.minecraft.server.level.ChunkMap anyPlayerCloseEnoughForSpawning(Lnet/minecraft/world/level/ChunkPos;)Z

# The live spawn state holds the only honest source for two rules, and neither has
# a getter on either version. Reading them is the difference between reporting the
# real cap state and guessing at it.
#
# spawnPotential        -> SpawnRule.SPAWN_CHARGE (biome spawn-cost budgets)
# localMobCapCalculator -> SpawnRule.CATEGORY_LOCAL_CAP (the per-player cap)
#
# Careful reading decompiled sources here: moddev applies this very file to the
# artifact it produces, so both fields appear public in the extracted sources once
# these lines exist. The compiler is the honest check, not the decompiler output.
public net.minecraft.world.level.NaturalSpawner$SpawnState spawnPotential
public net.minecraft.world.level.NaturalSpawner$SpawnState localMobCapCalculator
