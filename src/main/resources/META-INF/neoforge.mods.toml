modLoader = "javafml"
# Required on 1.21.1. Its absence is what makes FML reject the mod outright with
# "is not a valid mod file", which surfaces as the unit-test JVM refusing to start.
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Flatts3000/spawn-detective/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Flatts3000/spawn-detective"
authors = "${mod_authors}"
logoFile = "logo.png"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
