name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two separate jobs on purpose: `build` does not run the in-world suite, and the
# in-world suite is where this mod's correctness actually lives. Both are required
# to merge - a green compile proves nothing about whether the auditor still names
# the right cause.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon

  gameTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew runGameTestServer --no-daemon
