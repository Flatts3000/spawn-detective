org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

# -----------------------------------------------------------------------------
# Mod metadata - referenced from build.gradle and neoforge.mods.toml
# -----------------------------------------------------------------------------
mod_id=spawndoctor
mod_name=Spawn Doctor
mod_version=0.1.0-alpha.1
mod_license=MIT
mod_group_id=com.flatts.spawndoctor
mod_authors=Flatts3000
mod_description=A definitive answer to "why won't mobs spawn here?". Point the Spawn Probe at a block and Spawn Doctor replays the real natural-spawn pipeline for that exact position - caps, chunk state, player distance, biome spawn list, placement, light, collision, spawn charge - and names the rule that rejected it. Works with any mob from any mod.

# -----------------------------------------------------------------------------
# Minecraft / NeoForge versions
# -----------------------------------------------------------------------------
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neoforge_version=26.1.2.76
neoforge_loader_version_range=[4,)
