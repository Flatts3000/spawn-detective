org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

# -----------------------------------------------------------------------------
# Mod metadata - referenced from build.gradle and neoforge.mods.toml
# -----------------------------------------------------------------------------
mod_id=spawndetective
mod_name=Spawn Detective
mod_version=0.1.0-alpha.2
mod_license=MIT
mod_group_id=com.flatts.spawndetective
mod_authors=Flatts3000
mod_description=A definitive answer to "why won't mobs spawn here?". Point the Spawn Probe at a block and Spawn Detective replays the real natural-spawn pipeline for that exact position - caps, chunk state, player distance, biome spawn list, placement, light, collision, spawn charge - and names the rule that rejected it. Works with any mob from any mod.

# -----------------------------------------------------------------------------
# Minecraft / NeoForge versions
# -----------------------------------------------------------------------------
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neoforge_version=26.1.2.76
neoforge_loader_version_range=[4,)

# CurseForge project id (https://authors.curseforge.com/#/projects/1621450)
curseForgeProjectId=1621450
