plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
    // CurseForgeGradle wraps the upload API so `./gradlew publishCurseForge` pushes
    // a new file to the project page. Token comes from .env (gitignored), an env
    // var, or a gradle property - never from this file.
    id 'net.darkhax.curseforgegradle' version '1.2.30'
}

base {
    // MC version in the artifact name (Mekanism convention) so jars for different
    // game versions are unmistakable: spawndetective-26.1.2-0.1.0-alpha.1.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    version = neoforge_version

    accessTransformers {
        from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources').absolutePath,
                                    '--existing', file('src/main/resources').absolutePath
        }
        // Headless server that runs registered GameTests on boot, exits non-zero
        // on failure. moddev 2.0.141 has no gameTestServer() convenience method,
        // but NeoForge's userdev config exposes the run type - set it directly.
        gameTestServer {
            type.set('gameTestServer')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // moddev's JUnit integration boots a real mod context (registries populated,
    // tags resolvable) so unit tests can reference Minecraft classes.
    unitTest {
        enable()
        testedMod = mods.named("${mod_id}").get()
    }
}

repositories {
    // JEI - published by mezz to BlameJared's maven.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // Jade - served as the full jar via the Modrinth maven (compileOnly only; see
    // the dependency note below). Scoped so it never shadows other groups.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // JEI - compileOnly API so the @JeiPlugin class compiles, runtimeOnly jar so dev
    // sessions actually show the info page. This mod has no recipes; the plugin
    // exists to document the item's gestures where people look for item help.
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.6.2.38"
    runtimeOnly "mezz.jei:jei-26.1.2-neoforge:29.6.2.38"

    // Jade - compileOnly ONLY. Jade stays a manual run/mods drop-in at runtime;
    // adding it runtimeOnly would double-load against the drop-in and trip
    // NeoForge's duplicate-modid check. When Jade is present it discovers our
    // plugin; when it is absent the class is simply never loaded.
    // Modrinth gWlwZzoj = Jade 26.1.8+neoforge.
    compileOnly "maven.modrinth:jade:gWlwZzoj"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

tasks.processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'neoforge_loader_version_range', neoforge_loader_version_range
    inputs.property 'neoforge_version', neoforge_version

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            neoforge_version: neoforge_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

// `gradle clean` wipes build/moddev/*RunVmArgs.txt, which IntelliJ's generated run
// configs reference at launch. Regenerate them all in one task.
tasks.register('prepareAllRuns') {
    group = 'neoforge runs'
    description = 'Regenerate VM args / classpath files for the interactive moddev runs.'
    dependsOn 'prepareClientRun',
              'prepareServerRun',
              'prepareGameTestServerRun'
}

// ---------------------------------------------------------------------------
// Publishing
//
// `./gradlew publishCurseForge` after a successful build. Not run by CI - a
// release is a deliberate act, and a pipeline that publishes on green will
// eventually publish something nobody meant to ship.
//
// The API token is read from, in order: .env at the repo root (gitignored),
// the CURSEFORGE_API_KEY environment variable, then the cfApiToken gradle
// property. It is never committed.
// ---------------------------------------------------------------------------

/** Read a KEY=value file, ignoring blanks and comments. Returns empty if absent. */
def readDotEnv(File envFile) {
    def map = [:]
    if (!envFile.exists()) {
        return map
    }
    envFile.eachLine { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#')) {
            return
        }
        def eq = trimmed.indexOf('=')
        if (eq <= 0) {
            return
        }
        map[trimmed.substring(0, eq).trim()] = trimmed.substring(eq + 1).trim().replaceAll(/^["']|["']$/, '')
    }
    return map
}

def resolveCfApiToken() {
    return readDotEnv(file("${rootDir}/.env"))['CURSEFORGE_API_KEY']
        ?: System.getenv('CURSEFORGE_API_KEY')
        ?: findProperty('cfApiToken')
}

/**
 * Pull this version's section out of CHANGELOG.md - everything from `## v<version>`
 * to the next `## v` heading. Keeps the shipped changelog and the repo's in step,
 * because two changelogs that can disagree eventually will.
 */
def extractChangelogSection(File changelog, String version) {
    if (!changelog.exists()) {
        throw new GradleException("CHANGELOG.md is missing; a release needs one.")
    }
    def text = changelog.text
    def marker = "## v${version}"
    def start = text.indexOf(marker)
    if (start < 0) {
        throw new GradleException("CHANGELOG.md has no '${marker}' section. "
            + "Add one before publishing, or the upload would carry the wrong notes.")
    }
    def end = text.indexOf("\n## v", start + marker.length())
    return text.substring(start, end < 0 ? text.length() : end).trim()
}

// The project id only exists once the CurseForge page has been created, and
// CurseForgeGradle resolves it while configuring the task - so registering
// unconditionally breaks every Gradle invocation, including `build`, until then.
// Register the real task when it is set, and a task that explains itself when it
// is not.
if (findProperty('curseForgeProjectId')) {
    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        group = 'publishing'
        description = 'Upload the built jar to CurseForge.'
        dependsOn tasks.named('build')

        apiToken = resolveCfApiToken()

        def primary = upload(findProperty('curseForgeProjectId'), tasks.jar.archiveFile)
        // Alpha until it has been run somewhere that is not a dev environment.
        primary.releaseType = 'alpha'
        primary.addGameVersion(minecraft_version)
        primary.addModLoader('NeoForge')
        primary.addJavaVersion('Java 25')
        // Both sides: the audit runs server-side and the screen renders client-side,
        // so a client-only tag would have people installing it where it cannot work.
        primary.addEnvironment('Client', 'Server')
        // Declared optional so the page shows them as such rather than leaving
        // people to guess whether they are required.
        primary.addOptional('jade')
        primary.addOptional('jei')
        primary.changelog = extractChangelogSection(file("${rootDir}/CHANGELOG.md"), mod_version)
        primary.changelogType = 'markdown'
        primary.displayName = "${mod_name} ${mod_version}"

        doFirst {
            if (!apiToken) {
                throw new GradleException("CURSEFORGE_API_KEY not set. Put it in .env at the repo root, "
                    + "export it, or add cfApiToken to ~/.gradle/gradle.properties.")
            }
        }
    }
} else {
    tasks.register('publishCurseForge') {
        group = 'publishing'
        description = 'Upload the built jar to CurseForge (needs curseForgeProjectId first).'
        doFirst {
            throw new GradleException('curseForgeProjectId is not set. To publish: '
                + '(1) create the CurseForge project and copy its numeric id, '
                + '(2) add curseForgeProjectId=<id> to gradle.properties, '
                + '(3) put CURSEFORGE_API_KEY=<token> in .env at the repo root.')
        }
    }
}
